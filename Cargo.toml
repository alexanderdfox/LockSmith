[package]
name = "Locksmith"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.44", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rpassword = "7.3"
zeroize = { version = "1.8", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
axum = "0.7"
tower-http = { version = "0.5", features = ["fs", "cors"] }
keyring = "2.3"